# Circle web — separate from Arcus. Deploy as its own Render Static Site / Web Service.
# Do not point this at Arcus services.
services:
  - type: web
    name: circle-web
    runtime: static
    buildCommand: npm ci && npx expo export -p web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
