# Circle on Render — Blueprint
# Deploy: Dashboard → New → Blueprint → this repo
# Separate from any Arcus services.

databases:
  - name: circle-db
    plan: free
    databaseName: circle

services:
  - type: web
    name: circle-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: circle-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"

  - type: web
    name: circle-web
    runtime: static
    buildCommand: npm ci && npx expo export -p web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Must be the public circle-api URL (no trailing slash)
      - key: EXPO_PUBLIC_API_URL
        value: https://circle-api-uk0t.onrender.com
