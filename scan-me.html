<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Scan MyCircle</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#050508; color:#fff; font-family:-apple-system,BlinkMacSystemFont,sans-serif; text-align:center; padding:24px; }
    h1 { font-size:28px; margin:0 0 8px; letter-spacing:2px; }
    p { color:#9CA3AF; max-width:420px; line-height:1.5; margin:0 0 24px; }
    img { width:min(80vw,420px); height:auto; background:#fff; padding:16px; border-radius:16px; }
    .step { text-align:left; max-width:420px; margin-top:28px; color:#ddd; }
    .step li { margin:10px 0; }
    code { color:#A78BFA; }
  </style>
</head>
<body>
  <h1>MYCIRCLE</h1>
  <p>Open Expo Go on your iPhone and scan this code.</p>
  <img src="expo-qr.png" alt="Expo QR code" />
  <ol class="step">
    <li>On your iPhone, install <b>Expo Go</b> from the App Store if you don’t have it.</li>
    <li>Make sure your iPhone Wi‑Fi is the same as this Mac.</li>
    <li>Open <b>Expo Go</b> → tap <b>Scan QR code</b>.</li>
    <li>Point your camera at this screen.</li>
  </ol>
</body>
</html>
